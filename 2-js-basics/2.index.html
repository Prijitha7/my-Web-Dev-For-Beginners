<!-- inside index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typing Speed Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Typing Speed Game!</h1>
  <p>Test and improve your typing speed with a quote from Sherlock Holmes. Click <strong>Start</strong> to begin!</p>
  
  <p id="quote"></p> <!-- This will display our quote -->
  <p id="message"></p> <!-- This will display any status messages -->

  <div>
    <input type="text" aria-label="current word" id="typed-value" placeholder="Start typing here..." /> <!-- The textbox for typing -->
    <button type="button" id="start">Start</button> <!-- To start the game -->
  </div>

  <footer>
    <small>Happy typing and have fun!</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
